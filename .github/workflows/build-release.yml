name: Build Release

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v2.1.3, etc.

jobs:
  Build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate Plugin-SDK VS Projects
        shell: cmd
        run: |
          set PLUGIN_SDK_DIR=%GITHUB_WORKSPACE%\third-party\plugin-sdk
          "%PLUGIN_SDK_DIR%\tools\premake\premake5" vs2022 --file="%PLUGIN_SDK_DIR%\tools\premake\premake5.lua"

      - name: Build Plugin-SDK (GTA SA)
        shell: cmd
        run: |
          set PLUGIN_SDK_DIR=%GITHUB_WORKSPACE%\third-party\plugin-sdk
          cd "%PLUGIN_SDK_DIR%"
          msbuild plugin.sln /property:Configuration=Release /property:Platform="Mixed Platforms" /target:plugin_sa /m

      - name: Build 1991 Plugin
        shell: cmd
        run: |
          set PLUGIN_SDK_DIR=%GITHUB_WORKSPACE%\third-party\plugin-sdk
          msbuild 1991.sln /property:Configuration=Release /property:Platform=GTA-SA /m

      - name: Gather output files
        shell: cmd
        run: |
          mkdir release
          copy "bin\GTA-SA\Release\1991.SA.asi" release\

      - name: Create game assets archive
        shell: pwsh
        run: |
          Compress-Archive -Path "game_assets\*" -DestinationPath "release\game_assets.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1991-${{ github.ref_name }}
          path: release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## 1991 Plugin ${{ github.ref_name }}

            ### Installation
            1. Download `1991.SA.asi` and place it in your GTA San Andreas game/scripts folder
            2. Download `game_assets.zip` and add the files from game assets. Make sure you add pcbtns.txd inside models folder. It's a limitation for now.
          files: |
            release/1991.SA.asi
            release/game_assets.zip
          draft: false
          prerelease: false
